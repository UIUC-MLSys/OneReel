[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "onereel"
version = "0.1.0"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["third_party", ".git", ".claude", "outputs", "test_video"]
