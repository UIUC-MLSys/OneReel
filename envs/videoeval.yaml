name: videoeval
channels:
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - cuda-nvcc=11.8
  - cuda-toolkit=11.8
  - gcc_linux-64=11
  - gxx_linux-64=11
  - pip:
    - torch==2.7.1+cu118
    - torchvision==0.22.1+cu118
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - vbench==0.1.5
    - transformers==4.33.2
    - tokenizers==0.13.3
    - timm==1.0.12
    - decord==0.6.0
    - openai-clip==1.0.1
    - pyiqa==0.1.10
    - einops==0.8.2
    - opencv-python==4.11.0.86
    - imageio==2.37.2
    - pillow==12.0.0
    - numpy==1.26.4
    - scipy==1.15.3
    - scikit-image==0.25.2
    - scikit-learn==1.7.2
    - matplotlib==3.10.8
    - pandas==2.3.3
    - tqdm==4.67.3
    - pyyaml==6.0.3
    - easydict==1.13
    - ftfy==6.3.1
    - tabulate==0.9.0
    - tensorboard==2.20.0
    - omegaconf==2.3.0
    - hydra-core==1.3.2
    - fairscale==0.4.13
    - safetensors==0.7.0
    - huggingface-hub==0.36.1
    - git+https://github.com/facebookresearch/detectron2.git
